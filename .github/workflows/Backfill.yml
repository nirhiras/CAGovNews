name: Backfill Article Content

on:
  workflow_dispatch:
    inputs:
      agency:
        description: 'Single agency slug (leave blank for all)'
        required: false
      force:
        description: 'Force re-scrape even if content exists (true/false)'
        required: false
        default: 'false'
      dates_only:
        description: 'Only fix dates from archived HTML — no HTTP (true/false)'
        required: false
        default: 'false'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: cagovnews
        run: npm install

      - name: Run backfill
        working-directory: cagovnews
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AGENCY_FILTER: ${{ github.event.inputs.agency }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          DATES_ONLY: ${{ github.event.inputs.dates_only || 'false' }}
        run: node backfill.js
