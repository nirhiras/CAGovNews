name: Daily CA.gov News Crawler

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      agency:
        description: 'Single agency slug to crawl (leave blank for all)'
        required: false
      dry_run:
        description: 'Dry run — no DB writes (true/false)'
        required: false
        default: 'false'

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: cagovnews
        run: npm install

      - name: Run crawler
        working-directory: cagovnews
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AGENCY_FILTER: ${{ github.event.inputs.agency }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node crawler.js

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "alerts@cagovnews.com",
              "to": ["${{ secrets.ADMIN_EMAIL }}"],
              "subject": "CAGovNews crawler failed",
              "html": "<p>Crawler failed. <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View logs</a></p>"
            }'
